name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run tells you nothing useful, so cancel it and free the runner.
# Never cancel on main: those runs are the record of what actually shipped.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # bun, not npm: `bun.lock` is the only lockfile in the repo, so `npm ci`
      # has nothing to install from. Using bun here means CI resolves the exact
      # tree a contributor gets locally.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # --frozen-lockfile makes a lockfile that drifted out of sync with
      # package.json a build failure rather than a silent re-resolve. That
      # drift is what broke `npm install` on this repo before.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Build
        run: bun run build

      # The build is only meaningful if it produced both halves: vite emits the
      # client bundle, esbuild emits the server. A silent partial build would
      # otherwise pass.
      - name: Verify build output
        run: |
          set -euo pipefail
          for f in dist/index.html dist/server.cjs; do
            test -s "$f" || { echo "::error::missing or empty build artifact: $f"; exit 1; }
          done
          echo "build artifacts present:"
          ls -la dist
